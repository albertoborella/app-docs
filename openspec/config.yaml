# openspec/config.yaml — SDD configuration for app-docs
# Created by sdd-init on 2026-10-16. Do not delete; later phases read this file.

schema: spec-driven

init:
  project: app-docs
  initialized: "2026-10-16"
  status: success
  artifact_store: both # openspec/ files + Engram (equivalent to `hybrid` in the persistence contract)
  execution_mode: interactive
  delivery_strategy: ask-on-risk
  review_budget_lines: 400
  skill_resolution: paths-injected

context: |
  Project: app-docs — SDD documentation scaffold plus the dairy-doc-manager application (Phase 1 foundation landed; Phases 2-8 pending).
  Domain: manage official regulatory-body documents and requirements for dairy-product companies.
  Stack: Python >= 3.10 — FastAPI + SQLModel + SQLite (WAL) + Flet; pinned in pyproject.toml.
  Architecture: decided in openspec/changes/dairy-doc-manager/design.md — one FastAPI process is the system of record on all three targets; web co-locates the Flet UI via flet.fastapi; desktop and mobile are native HTTP clients of the same API.
  Testing: pytest test runner and ruff linter available (details in testing: block below).
  Conventions: user-authored docs/ scaffold is the source of truth; artifacts in English; application UI copy in Spanish (neutral).

strict_tdd: false

testing:
  strict_tdd: false
  detected: "2026-10-17"
  reason: pytest and ruff installed via pyproject.toml (Python >= 3.10, FastAPI/SQLModel/Flet stack).
  test_runner:
    command: "pytest"
    framework: pytest
  test_layers:
    unit:
      available: true
      tool: pytest
    integration:
      available: false
      tool: null
    e2e:
      available: false
      tool: null
  coverage:
    available: false
    command: null
  quality_tools:
    linter:
      available: true
      command: "ruff check ."
    type_checker:
      available: false
      command: null
    formatter:
      available: true
      command: "ruff format --check"

rules:
  proposal:
    - Include rollback plan for risky changes
    - Requirements are not gathered yet; proposals MUST NOT invent requirements
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing code patterns
      - Re-run detection and update `testing:` once a stack and test runner exist
    tdd: false
    test_command: "pytest"
  verify:
    test_command: "pytest"
    build_command: ""
    coverage_threshold: 0
    note: pytest and ruff are available; verification runs the real test suite. Coverage tooling is not yet configured (coverage_threshold stays 0 until it is).
  archive:
    - Warn before merging destructive deltas
