[project]
name = "dairy-doc-manager"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "bcrypt==5.0.0",
    "fastapi==0.143.3",
    "flet[web]==1.0.4",
    "httpx==0.28.1",
    "python-multipart==0.0.32",
    "sqlmodel==0.0.48",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
